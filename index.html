<!DOCTYPE html>
<html lang="pa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ਤਾਜ ਢਿੱਲੋਂ ਟਰੇਡਿੰਗ ਕੰਪਨੀ - ਹਿਸਾਬ ਕੈਲਕੁਲੇਟਰ</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f0f4f8; display: flex; justify-content: center; padding: 20px; }
        .calc-card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
        .header { text-align: center; border-bottom: 2px solid #3498db; margin-bottom: 20px; padding-bottom: 10px; }
        h2 { color: #1a5276; margin: 0; font-size: 24px; }
        .address { font-size: 14px; color: #7f8c8d; font-weight: bold; margin-top: 5px; }
        
        .input-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 4px; font-weight: bold; color: #34495e; font-size: 15px; }
        select, input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        
        .result-box { background: #e8f6f3; padding: 15px; border-radius: 10px; margin-top: 20px; border: 1px solid #d1f2eb; }
        .result-line { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 17px; color: #2c3e50; }
        .total-amt { font-weight: bold; color: #196f3d; font-size: 24px; border-top: 2px solid #abd6c1; padding-top: 10px; }
        
        .print-btn { width: 100%; background: #2ecc71; color: white; padding: 15px; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 15px; transition: 0.3s; }
        .print-btn:hover { background: #27ae60; }

        /* Print Styling */
        @media print {
            body { background: white; padding: 0; }
            .print-btn, .input-group, label, select, input { display: none; }
            .calc-card { box-shadow: none; border: none; width: 100%; max-width: 100%; }
            .result-box { border: 1px solid #000; background: white; }
            .print-info { display: block !important; margin-bottom: 20px; border-bottom: 1px dashed #000; padding-bottom: 10px; }
        }
        .print-info { display: none; }
    </style>
</head>
<body>

<div class="calc-card" id="receipt">
    <div class="header">
        <h2>ਤਾਜ ਢਿੱਲੋਂ ਟਰੇਡਿੰਗ ਕੰਪਨੀ</h2>
        <div class="address">VPO ਸ਼ਾਹਪੁਰ ਜਾਜਨ, ਤਹਿਸੀਲ DBN, ਜ਼ਿਲ੍ਹਾ ਗੁਰਦਾਸਪੁਰ - 143604</div>
    </div>

    <div class="input-group">
        <label>ਕਿਸਾਨ ਦਾ ਨਾਮ</label>
        <input type="text" id="farmerName" placeholder="ਨਾਮ ਲਿਖੋ">
    </div>
    <div class="input-group">
        <label>ਪਿੰਡ ਦਾ ਨਾਮ</label>
        <input type="text" id="village" placeholder="ਪਿੰਡ ਲਿਖੋ">
    </div>

    <div class="input-group">
        <label>ਫਸਲ ਦੀ ਚੋਣ (Crop)</label>
        <select id="crop" onchange="updateBharti()">
            <option value="paddy">ਝੋਨਾ (Paddy)</option>
            <option value="wheat">ਕਣਕ (Wheat)</option>
        </select>
    </div>

    <div class="input-group">
        <label>ਕੁੱਲ ਵਜ਼ਨ (ਕੁਇੰਟਲ ਵਿੱਚ)</label>
        <input type="number" id="qtlInput" placeholder="0.00" oninput="calculate()">
    </div>

    <div class="input-group">
        <label>ਭਰਤੀ (ਕਿਲੋ ਪ੍ਰਤੀ ਬੋਰੀ)</label>
        <select id="bharti" onchange="calculate()">
            </select>
    </div>

    <div class="input-group">
        <label>ਭਾਅ/ਰੇਟ (ਪ੍ਰਤੀ ਕੁਇੰਟਲ ₹)</label>
        <input type="number" id="rate" placeholder="0" oninput="calculate()">
    </div>

    <div class="input-group">
        <label>ਕਾਟ (ਕਿਲੋ ਪ੍ਰਤੀ ਕੁਇੰਟਲ)</label>
        <input type="number" id="kaat" value="0" oninput="calculate()">
    </div>

    <div class="input-group">
        <label>ਮਜ਼ਦੂਰੀ (ਪ੍ਰਤੀ ਬੋਰੀ ₹)</label>
        <input type="number" id="labour" value="0" oninput="calculate()">
    </div>

    <div class="print-info" id="printDetails">
        <p><strong>ਕਿਸਾਨ:</strong> <span id="pName"></span></p>
        <p><strong>ਪਿੰਡ:</strong> <span id="pVillage"></span></p>
        <p><strong>ਮਿਤੀ (Date):</strong> <span id="pDate"></span></p>
    </div>

    <div class="result-box">
        <div class="result-line"><span>ਕੁੱਲ ਬੋਰੀਆਂ:</span><span id="bagsRes">0</span></div>
        <div class="result-line"><span>ਸਾਫ਼ ਵਜ਼ਨ (ਕਾਟ ਤੋਂ ਬਾਅਦ):</span><span id="netWeight">0.00 Qtl</span></div>
        <div class="result-line"><span>ਕੁੱਲ ਮਜ਼ਦੂਰੀ:</span><span id="labourCost">₹ 0.00</span></div>
        <div class="result-line total-amt"><span>ਕੁੱਲ ਬਣਦੀ ਰਕਮ:</span><span id="totalPay">₹ 0.00</span></div>
    </div>

    <button class="print-btn" onclick="printReceipt()">ਰਸੀਦ ਪ੍ਰਿੰਟ ਕਰੋ</button>
</div>

<script>
    function updateBharti() {
        const crop = document.getElementById('crop').value;
        const bhartiDropdown = document.getElementById('bharti');
        bhartiDropdown.innerHTML = '';
        const options = (crop === 'paddy') ? [35, 37.5, 50] : [50];
        options.forEach(val => {
            let opt = document.createElement('option');
            opt.value = val;
            opt.innerHTML = val + " ਕਿਲੋ";
            bhartiDropdown.appendChild(opt);
        });
        calculate();
    }

    function calculate() {
        const qtl = parseFloat(document.getElementById('qtlInput').value) || 0;
        const bharti = parseFloat(document.getElementById('bharti').value) || 1;
        const rate = parseFloat(document.getElementById('rate').value) || 0;
        const kaatPerQtl = parseFloat(document.getElementById('kaat').value) || 0;
        const labourPerBag = parseFloat(document.getElementById('labour').value) || 0;

        const totalKg = qtl * 100;
        const totalBags = Math.ceil(totalKg / bharti);
        const netWeightQtl = (totalKg - (qtl * kaatPerQtl)) / 100;
        const totalLabour = totalBags * labourPerBag;
        const finalAmount = (netWeightQtl * rate) - totalLabour;

        document.getElementById('bagsRes').innerText = totalBags;
        document.getElementById('netWeight').innerText = netWeightQtl.toFixed(2) + " ਕੁਇੰਟਲ";
        document.getElementById('labourCost').innerText = "₹ " + totalLabour.toFixed(2);
        document.getElementById('totalPay').innerText = "₹ " + finalAmount.toLocaleString('en-IN', {minimumFractionDigits: 2});
    }

    function printReceipt() {
        document.getElementById('pName').innerText = document.getElementById('farmerName').value || "---";
        document.getElementById('pVillage').innerText = document.getElementById('village').value || "---";
        document.getElementById('pDate').innerText = new Date().toLocaleDateString('en-IN');
        window.print();
    }

    updateBharti();
</script>

</body>
</html>
