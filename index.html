<!DOCTYPE html>
<html lang="pa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ਤਾਜ ਢਿੱਲੋਂ ਟਰੇਡਿੰਗ ਕੰਪਨੀ - ਪੱਕੀ ਰਸੀਦ</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f0f4f8; display: flex; justify-content: center; padding: 20px; }
        .calc-card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 100%; max-width: 600px; border: 1px solid #ddd; }
        .header { text-align: center; border-bottom: 2px solid #3498db; margin-bottom: 15px; padding-bottom: 10px; }
        h2 { color: #1a5276; margin: 0; font-size: 26px; }
        .address { font-size: 14px; color: #555; font-weight: bold; margin-top: 5px; }
        
        .input-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 4px; font-weight: bold; color: #34495e; font-size: 15px; }
        select, input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        
        .parchi-row { display: flex; gap: 10px; margin-bottom: 8px; align-items: center; }
        .add-btn { background: #3498db; color: white; border: none; padding: 10px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; margin-bottom: 15px; width: 100%; }
        .remove-btn { background: #e74c3c; color: white; border: none; padding: 8px; border-radius: 5px; cursor: pointer; font-size: 12px; }

        .result-box { background: #e8f6f3; padding: 15px; border-radius: 10px; margin-top: 20px; border: 1px solid #d1f2eb; }
        .result-line { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 17px; color: #2c3e50; }
        .total-amt { font-weight: bold; color: #196f3d; font-size: 26px; border-top: 2px solid #abd6c1; padding-top: 10px; margin-top: 10px; }
        
        .print-btn { width: 100%; background: #2ecc71; color: white; padding: 15px; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 15px; }

        /* Print Design */
        @media print {
            body { background: white; padding: 0; }
            .print-btn, .add-btn, .remove-btn, label, select, input, .header-input { display: none !important; }
            .calc-card { box-shadow: none; border: 1px solid #000; width: 100%; padding: 10px; }
            .print-only { display: block !important; }
            .parchi-display { display: block !important; margin: 10px 0; border-bottom: 1px dashed #000; padding-bottom: 10px; }
            .result-box { background: white !important; border: 1px solid #000 !important; }
        }
        .print-only { display: none; }
        .parchi-display { display: none; }
    </style>
</head>
<body>

<div class="calc-card">
    <div class="header">
        <h2>ਤਾਜ ਢਿੱਲੋਂ ਟਰੇਡਿੰਗ ਕੰਪਨੀ</h2>
        <div class="address">VPO ਸ਼ਾਹਪੁਰ ਜਾਜਨ, ਤਹਿਸੀਲ DBN, ਜ਼ਿਲ੍ਹਾ ਗੁਰਦਾਸਪੁਰ - 143604</div>
    </div>

    <div class="header-input">
        <div class="input-group">
            <label>ਕਿਸਾਨ ਦਾ ਨਾਮ</label>
            <input type="text" id="farmerName" placeholder="ਨਾਮ ਲਿਖੋ">
        </div>
        <div class="input-group">
            <label>ਪਿੰਡ ਦਾ ਨਾਮ</label>
            <input type="text" id="village" placeholder="ਪਿੰਡ ਲਿਖੋ">
        </div>
        <div class="input-group">
            <label>ਜਿਨਸ / ਫਸਲ</label>
            <select id="crop" onchange="updateBharti()">
                <option value="ਝੋਨਾ (Paddy)">ਝੋਨਾ (Paddy)</option>
                <option value="ਕਣਕ (Wheat)">ਕਣਕ (Wheat)</option>
            </select>
        </div>
    </div>

    <label>ਕੰਡਾ ਪਰਚੀ (Kg)</label>
    <div id="parchiContainer">
        <div class="parchi-row">
            <input type="number" class="parchi-kg" placeholder="ਵਜ਼ਨ (Kg)" oninput="calculate()">
        </div>
    </div>
    <button class="add-btn" onclick="addParchi()">+ ਹੋਰ ਪਰਚੀ ਜੋੜੋ</button>

    <div class="input-group">
        <label>ਭਰਤੀ (ਪ੍ਰਤੀ ਬੋਰੀ)</label>
        <select id="bharti" onchange="calculate()"></select>
    </div>

    <div style="display: flex; gap: 10px;">
        <div class="input-group" style="flex: 1;">
            <label>ਭਾਅ (ਪ੍ਰਤੀ ਕੁਇੰਟਲ)</label>
            <input type="number" id="rate" placeholder="0" oninput="calculate()">
        </div>
        <div class="input-group" style="flex: 1;">
            <label>ਕਾਟ (Kg/Qtl)</label>
            <input type="number" id="kaat" value="0" oninput="calculate()">
        </div>
    </div>

    <div class="input-group">
        <label>ਮਜ਼ਦੂਰੀ (ਪ੍ਰਤੀ ਬੋਰੀ ₹)</label>
        <input type="number" id="labour" value="0" oninput="calculate()">
    </div>

    <div class="print-only">
        <div style="display: flex; justify-content: space-between;">
            <span><strong>ਕਿਸਾਨ:</strong> <span id="pName"></span></span>
            <span><strong>ਪਿੰਡ:</strong> <span id="pVillage"></span></span>
        </div>
        <div style="display: flex; justify-content: space-between; margin-top: 5px;">
            <span><strong>ਜਿਨਸ:</strong> <span id="pCrop"></span></span>
            <span><strong>ਮਿਤੀ:</strong> <span id="pDate"></span></span>
        </div>
        <div class="parchi-display">
            <p><strong>ਕੰਡਾ ਪਰਚੀ ਡਿਟੇਲ (ਕਿੱਲੋ):</strong></p>
            <div id="pList" style="font-size: 14px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px;"></div>
        </div>
        <hr>
    </div>

    <div class="result-box">
        <div class="result-line"><span>ਕੁੱਲ ਵਜ਼ਨ:</span><span id="totalKgRes">0</span> Kg</div>
        <div class="result-line"><span>ਕੁੱਲ ਕੁਇੰਟਲ:</span><span id="totalQtlRes">0.00</span> Qtl</div>
        <div class="result-line"><span>ਕੁੱਲ ਬੋਰੀਆਂ:</span><span id="bagsRes">0</span></div>
        <div class="result-line"><span>ਸਾਫ਼ ਵਜ਼ਨ (Net):</span><span id="netWeight">0.00</span> Qtl</div>
        <div class="result-line"><span>ਮਜ਼ਦੂਰੀ ਖਰਚਾ:</span><span id="labourCost">₹ 0.00</span></div>
        <div class="result-line total-amt"><span>ਕੁੱਲ ਰਕਮ:</span><span id="totalPay">₹ 0.00</span></div>
    </div>

    <button class="print-btn" onclick="printReceipt()">ਰਸੀਦ ਪ੍ਰਿੰਟ ਕਰੋ</button>
</div>

<script>
    function addParchi() {
        const container = document.getElementById('parchiContainer');
        const div = document.createElement('div');
        div.className = 'parchi-row';
        div.innerHTML = `
            <input type="number" class="parchi-kg" placeholder="ਵਜ਼ਨ (Kg)" oninput="calculate()">
            <button class="remove-btn" onclick="this.parentElement.remove(); calculate();">ਹਟਾਓ</button>
        `;
        container.appendChild(div);
    }

    function updateBharti() {
        const crop = document.getElementById('crop').value;
        const bhartiDropdown = document.getElementById('bharti');
        bhartiDropdown.innerHTML = '';
        const options = (crop.includes('Paddy')) ? [35, 37.5, 50] : [50];
        options.forEach(val => {
            let opt = document.createElement('option');
            opt.value = val;
            opt.innerHTML = val + " ਕਿੱਲੋ";
            bhartiDropdown.appendChild(opt);
        });
        calculate();
    }

    function calculate() {
        let totalKg = 0;
        document.querySelectorAll('.parchi-kg').forEach(input => {
            totalKg += parseFloat(input.value) || 0;
        });

        const bharti = parseFloat(document.getElementById('bharti').value) || 1;
        const rate = parseFloat(document.getElementById('rate').value) || 0;
        const kaatPerQtl = parseFloat(document.getElementById('kaat').value) || 0;
        const labourPerBag = parseFloat(document.getElementById('labour').value) || 0;

        const totalQtl = totalKg / 100;
        const totalBags = Math.ceil(totalKg / bharti);
        const netWeightQtl = (totalKg - (totalQtl * kaatPerQtl)) / 100;
        const totalLabour = totalBags * labourPerBag;
        const finalAmount = (netWeightQtl * rate) - totalLabour;

        document.getElementById('totalKgRes').innerText = totalKg;
        document.getElementById('totalQtlRes').innerText = totalQtl.toFixed(2);
        document.getElementById('bagsRes').innerText = totalBags;
        document.getElementById('netWeight').innerText = netWeightQtl.toFixed(2);
        document.getElementById('labourCost').innerText = "₹ " + totalLabour.toFixed(2);
        document.getElementById('totalPay').innerText = "₹ " + finalAmount.toLocaleString('en-IN', {minimumFractionDigits: 2});
    }

    function printReceipt() {
        document.getElementById('pName').innerText = document.getElementById('farmerName').value || "---";
        document.getElementById('pVillage').innerText = document.getElementById('village').value || "---";
        document.getElementById('pCrop').innerText = document.getElementById('crop').value;
        document.getElementById('pDate').innerText = new Date().toLocaleDateString('en-IN');
        
        // Detailed Parchi List for Print
        const pList = document.getElementById('pList');
        pList.innerHTML = '';
        document.querySelectorAll('.parchi-kg').forEach((input, index) => {
            if(input.value) {
                pList.innerHTML += `<span>P${index+1}: ${input.value}kg</span>`;
            }
        });

        window.print();
    }

    updateBharti();
</script>

</body>
</html>
